<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2826"/><stop offset="1" stop-color="#141417"/>
    </linearGradient>
    <linearGradient id="front" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E5876A"/><stop offset="1" stop-color="#D97757"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity=".45"/>
    </filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <rect x="100.5" y="100.5" width="823" height="823" rx="185" fill="none" stroke="#ffffff" stroke-opacity=".07" stroke-width="2"/>
  <!-- back cards -->
  <rect x="300" y="236" width="424" height="300" rx="44" fill="#D97757" opacity=".28"/>
  <rect x="258" y="290" width="508" height="340" rx="48" fill="#D97757" opacity=".5" filter="url(#sh)"/>
  <!-- front card -->
  <rect x="212" y="352" width="600" height="420" rx="56" fill="url(#front)" filter="url(#sh)"/>
  <path d="M318 488 L418 562 L318 636" fill="none" stroke="#1d1a18" stroke-width="46" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="460" y="612" width="150" height="46" rx="23" fill="#1d1a18"/>
</svg>
