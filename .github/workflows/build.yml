# Builds the macOS and Windows apps. Runs on every push to main and on version tags (v1.2.3),
# where the zips are also attached to a GitHub Release.
name: build
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            script: package
            dir: Claude Deck-darwin-arm64
            zip: Claude-Deck-mac-arm64.zip
          - os: windows-latest
            script: package:win
            dir: Claude Deck-win32-x64
            zip: Claude-Deck-windows-x64.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      # On failure, repeat the last lines as error annotations (those are visible without logging in)
      - shell: bash
        run: npm run ${{ matrix.script }} 2>&1 | tee build.log; rc=${PIPESTATUS[0]}; if [ $rc -ne 0 ]; then tail -25 build.log | sed 's/^/::error::/'; fi; exit $rc
      # Sign with the project's certificate (secrets MAC_CERT_P12 = base64 of deck.p12, MAC_CERT_PASSWORD) so the
      # app keeps the same identity across updates and macOS remembers its permissions. Ad-hoc without them.
      # sign.sh also makes node-pty's spawn-helper executable (or no terminal can start: "posix_spawnp failed").
      - if: runner.os == 'macOS'
        env:
          MAC_CERT_P12: ${{ secrets.MAC_CERT_P12 }}
          DECK_P12_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: |
          if [ -n "$MAC_CERT_P12" ]; then echo "$MAC_CERT_P12" | base64 --decode > "$RUNNER_TEMP/deck.p12"; export DECK_P12="$RUNNER_TEMP/deck.p12"; fi
          ./sign.sh "dist/${{ matrix.dir }}/Claude Deck.app"
          for f in "dist/${{ matrix.dir }}/Claude Deck.app/Contents/Resources/app.asar.unpacked/node_modules/node-pty/prebuilds/darwin-"*/spawn-helper; do test -x "$f" || { echo "not executable: $f"; exit 1; }; done
      - name: Zip
        shell: bash
        run: |
          cd dist
          if [ "$RUNNER_OS" = "Windows" ]; then 7z a -r "../${{ matrix.zip }}" "${{ matrix.dir }}"; else ditto -c -k --keepParent "${{ matrix.dir }}/Claude Deck.app" "../${{ matrix.zip }}"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.zip }}
          path: ${{ matrix.zip }}
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.zip }}
          # v1.2.3-rc1 tags become pre-releases: downloadable for testing, but never offered by the in-app updater
          prerelease: ${{ contains(github.ref_name, '-') }}
