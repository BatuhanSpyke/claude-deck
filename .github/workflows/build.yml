# Builds the macOS and Windows apps. Runs on every push to main and on version tags (v1.2.3),
# where the zips are also attached to a GitHub Release.
name: build
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            script: package
            dir: Claude Deck-darwin-arm64
            zip: Claude-Deck-mac-arm64.zip
          - os: windows-latest
            script: package:win
            dir: Claude Deck-win32-x64
            zip: Claude-Deck-windows-x64.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run ${{ matrix.script }}
      # No Apple Developer ID: ad-hoc sign so macOS shows "unidentified developer" instead of "damaged"
      - if: runner.os == 'macOS'
        run: codesign --force --deep --sign - "dist/${{ matrix.dir }}/Claude Deck.app"
      - name: Zip
        shell: bash
        run: |
          cd dist
          if [ "$RUNNER_OS" = "Windows" ]; then 7z a -r "../${{ matrix.zip }}" "${{ matrix.dir }}"; else ditto -c -k --keepParent "${{ matrix.dir }}/Claude Deck.app" "../${{ matrix.zip }}"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.zip }}
          path: ${{ matrix.zip }}
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.zip }}
